function seeded(n){let x=(n*9301+49297)%233280;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function buildQuestions(s,d){
 const rand=seeded(d*131+(s==="math"?7:91));let out=[];
 const choose=a=>a[Math.floor(rand()*a.length)];
 for(let i=0;i<30;i++){
  const topicIndex=Math.floor(i/2)%15;
  let q,ans,opts,explain;
  if(s==="math"){
   switch(topicIndex){
    case 0:{let a=2+Math.floor(rand()*8),b=1+Math.floor(rand()*12),x=1+Math.floor(rand()*10);q=`Solve for x: ${a}x + ${b} = ${a*x+b}.`;ans=String(x);explain=`Subtract ${b} from both sides, then divide by ${a}.`;break}

    case 5:{let a=2+Math.floor(rand()*8),n=3+Math.floor(rand()*8);q=`An arithmetic sequence has first term  ${a} and common difference 3. Find term ${n}.`;ans=String(a+(n-1)*3);explain=`The nth term is first term + (n − 1) × common difference.`;break}
    case 6:{let red=1+Math.floor(rand()*5),blue=2+Math.floor(rand()*6);q=`A bag has ${red} red and ${blue} blue balls. What is P(red) on one random draw?`;ans=`${red}/${red+blue}`;explain=`Favourable outcomes ÷ total outcomes = ${red}/${red+blue}.`;break}
    case 7:{let a=2+Math.floor(rand()*20),b=2+Math.floor(rand()*20);q=`Find the mean of ${a}, ${b}, and ${a+b}.`;ans=String((a+b+a+b)/3);explain=`Mean = sum of values ÷ number of values.`;break}
    case 8:{let a=2+Math.floor(rand()*8),x=1+Math.floor(rand()*8);q=`Differentiate y = ${a}x² with respect to x.`;ans=`${2*a}x`;explain=`Using d(x²)/dx = 2x, the derivative is ${2*a}x.`;break}
    case 9:{let a=1+Math.floor(rand()*6),b=2+Math.floor(rand()*8);q=`Evaluate ∫ ${a}x dx.`;ans=`${a}x²/2 + C`;explain=`Increase the power by one and divide by the new power.`;break}
    case 10:{let a=1+Math.floor(rand()*5),b=2+Math.floor(rand()*6);q=`If vectors u = (${a}, 0) and v = (0, ${b}), what is u · v?`;ans="0";explain="The dot product is a₁b₁ + a₂b₂; both cross-products are zero.";break}

    case 12:{let a=1+Math.floor(rand()*5);q=`What is i² in the complex number system?`;ans="-1";explain="The imaginary unit is defined by i² = −1.";break}

   }
  } else {
   switch(topicIndex){
    case 0:{let v=5+Math.floor(rand()*25),t=2+Math.floor(rand()*10);q=`A vehicle travels at ${v} m/s for ${t} s. How far does it travel?`;ans=`${v*t} m`;explain=`Distance = speed × time = ${v} × ${t} = ${v*t} m.`;break}
    case 1:{let m=2+Math.floor(rand()*10),a=2+Math.floor(rand()*8);q=`What net force accelerates a ${m} kg object at ${a} m/s²?`;ans=`${m*a} N`;explain=`Newton’s second law: F = ma = ${m} × ${a} = ${m*a} N.`;break}
    case 2:{let m=2+Math.floor(rand()*8),v=2+Math.floor(rand()*10);q=`Find the kinetic energy of a ${m} kg object moving at ${v} m/s.`;ans=`${m*v*v/2} J`;explain=`Kinetic energy = ½mv² = ½ × ${m} × ${v}².`;break}
    case 3:{let m=2+Math.floor(rand()*10),v=2+Math.floor(rand()*8);q=`A ${m} kg object moves at ${v} m/s. Find its momentum.`;ans=`${m*v} kg·m/s`;explain=`Momentum = mass × velocity = ${m} × ${v}.`;break}

    case 5:{let m=2+Math.floor(rand()*8),g=10,h=2+Math.floor(rand()*10);q=`Using g = 10 m/s², find the weight of a ${m} kg object.`;ans=`${m*10} N`;explain=`Weight = mg = ${m} × 10 = ${m*10} N.`;break}
    case 6:{let f=100+Math.floor(rand()*500),lam=1+Math.floor(rand()*5);q=`A wave has frequency ${f} Hz and wavelength ${lam} m. Find its speed.`;ans=`${f*lam} m/s`;explain=`Wave speed = frequency × wavelength.`;break}
    case 7:{let m=1+Math.floor(rand()*5),c=4200,dt=2+Math.floor(rand()*20);q=`How much heat is needed to warm ${m} kg of water by ${dt}°C? Use c = 4200 J/(kg·°C).`;ans=`${m*c*dt} J`;explain=`Q = mcΔT = ${m} × 4200 × ${dt}.`;break}
    case 8:{let v=6+Math.floor(rand()*20),r=2+Math.floor(rand()*8);q=`A ${r} Ω resistor has ${v} V across it. Find the current.`;ans=`${v/r} A`;explain=`Ohm’s law: I = V/R = ${v}/${r} A.`;break}
    case 9:{let n=2+Math.floor(rand()*8),b=2+Math.floor(rand()*5);q=`A coil has ${n} turns and magnetic flux changes by ${b} Wb in 1 s. Find average induced emf magnitude.`;ans=`${n*b} V`;explain=`Faraday’s law magnitude = turns × flux-change rate = ${n} × ${b}.`;break}
    case 10:{let u=2+Math.floor(rand()*8),v=u+2+Math.floor(rand()*8);q=`A converging lens has focal length 10 cm. Using 1/f = 1/v − 1/u with signed distances, which law relates object and image distances?`;ans="Thin-lens equation";explain="The thin-lens equation connects focal length with object and image distances.";break}
    case 11:{let f=2+Math.floor(rand()*8);q=`A photon has frequency ${f} × 10¹⁴ Hz. Using h = 6.63 × 10⁻³⁴ J·s, which expression gives its energy?`;ans=`6.63 × ${f} × 10⁻²⁰ J`;explain="Photon energy is E = hf; multiply Planck’s constant by frequency.";break}
    case 12:{let v=12+Math.floor(rand()*18),r=2+Math.floor(rand()*5);q=`A wire carries ${v} A in a ${r} T field, perpendicular to the field. For 1 m of wire, find force.`;ans=`${v*r} N`;explain=`Magnetic force F = BIL = ${r} × ${v} × 1 N.`;break}
    case 13:{let I=2+Math.floor(rand()*5),r=2+Math.floor(rand()*6);q=`A rotor has moment of inertia ${r} kg·m² and angular acceleration ${I} rad/s². Find torque.`;ans=`${r*I} N·m`;explain=`Torque = moment of inertia × angular acceleration.`;break}

function kannadaExplanation(e){
 const simple={"The imaginary unit is defined by i² = −1.":"ಕಾಲ್ಪನಿಕ ಘಟಕದ ವ್ಯಾಖ್ಯಾನ i² = −1.","This is a standard special-angle sine value.":"ಇದು ವಿಶೇಷ ಕೋನದ ಸೈನ್‌ನ ಪ್ರಮಾಣಿತ ಮೌಲ್ಯ.","The thin-lens equation connects focal length with object and image distances.":"ತೆಳು ಮಸೂರದ ಸಮೀಕರಣವು ನಾಭಿದೂರ, ವಸ್ತುದೂರ ಮತ್ತು ಪ್ರತಿಬಿಂಬದೂರವನ್ನು ಸಂಬಂಧಿಸುತ್ತದೆ.","Photon energy is E = hf; multiply Planck’s constant by frequency.":"ಫೋಟಾನ್‌ನ ಶಕ್ತಿ E = hf. ಪ್ಲಾಂಕ್ ಸ್ಥಿರಾಂಕವನ್ನು ಆವೃತ್ತಿಯಿಂದ ಗುಣಿಸಿ.","The dot product is a₁b₁ + a₂b₂; both cross-products are zero.":"ಡಾಟ್ ಗುಣಲಬ್ಧ a₁b₁ + a₂b₂. ಇಲ್ಲಿ ಎರಡೂ ಗುಣಲಬ್ಧಗಳು ಶೂನ್ಯ.","Mean = sum of values ÷ number of values.":"ಸರಾಸರಿ = ಮೌಲ್ಯಗಳ ಮೊತ್ತ ÷ ಮೌಲ್ಯಗಳ ಸಂಖ್ಯೆ.","Increase the power by one and divide by the new power.":"ಘಾತವನ್ನು ಒಂದರಿಂದ ಹೆಚ್ಚಿಸಿ, ಹೊಸ ಘಾತದಿಂದ ಭಾಗಿಸಿ.","For a continuous linear expression, substitute the approaching value.":"ನಿರಂತರ ರೇಖೀಯ ಅಭಿವ್ಯಕ್ತಿಯಲ್ಲಿ, x ಸಮೀಪಿಸುವ ಮೌಲ್ಯವನ್ನು ಬದಲಿಯಾಗಿ ಹಾಕಿ."};
 if(simple[e]) return simple[e];
 return "ಸೂತ್ರವನ್ನು ಬಳಸಿ ಮೌಲ್ಯಗಳನ್ನು ಬದಲಿಸಿ ಗಣನೆ ಮಾಡಿ: "+e.replace(/Subtract /g,"ಕಳೆಯಿರಿ ").replace(/both sides/g,"ಎರಡೂ ಬದಿಗಳಿಂದ").replace(/divide by/g,"ಇಂದ ಭಾಗಿಸಿ").replace(/Area = length × width/g,"ವಿಸ್ತೀರ್ಣ = ಉದ್ದ × ಅಗಲ").replace(/Distance = speed × time/g,"ದೂರ = ವೇಗ × ಸಮಯ").replace(/Newton’s second law/g,"ನ್ಯೂಟನ್‌ನ ಎರಡನೇ ನಿಯಮ").replace(/Kinetic energy/g,"ಚಲನಶಕ್ತಿ").replace(/Momentum/g,"ಸಂವೇಗ").replace(/Weight/g,"ತೂಕ").replace(/Wave speed/g,"ಅಲೆಯ ವೇಗ").replace(/Ohm’s law/g,"ಓಮ್ ನಿಯಮ").replace(/Torque/g,"ಬಲಭ್ರಾಮಕ");
}

function render(){
 const t=translations[lang];$("tagline").textContent=t.tagline;$("langLabel").textContent=t.language;$("subjectLabel").textContent=t.subject;
 $("subject").options[0].text=t.math;$("subject").options[1].text=t.physics;$("checkBtn").textContent=t.check;$("nextBtn").textContent=t.next;
 $("dayPill").textContent=`${t.day} ${day} ${t.of}`;$("topicPill").textContent=topicFor(subject,day);$("intro").textContent=t.intro;
 $("noteTitle").textContent=t.noteTitle;$("note").textContent=t.note;
 $("counter").textContent=`${t.question} ${idx+1}/30`;$("score").textContent=`${t.score}: ${score}`;$("progressBar").style.width=`${(idx/30)*100}%`;
 const item=questions[idx];$("topicPill").textContent=item.topic;$("question").textContent=item.q;$("options").innerHTML="";selected=null;answered=false;$("feedback").className="feedback hidden";
 item.opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${String.fromCharCode(65+i)}. ${o}`;b.onclick=()=>{if(answered)return;selected=o;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")};$("options").appendChild(b)});
 $("checkBtn").disabled=false;$("nextBtn").textContent=idx===29?t.complete:t.next;
}
function check(){const t=translations[lang];if(answered)return;if(selected===null){$("feedback").textContent=t.choose;$("feedback").className="feedback bad";return}answered=true;let item=questions[idx],correct=selected===item.ans;if(correct)score++;$("score").textContent=`${t.score}: ${score}`;$("feedback").textContent=(correct?t.correct:t.wrong+item.ans)+` ${item.explain}`;$("feedback").className="feedback "+(correct?"good":"bad");document.querySelectorAll(".choice").forEach(b=>b.disabled=true);$("checkBtn").disabled=true}
function next(){if(idx===29){$("quizPanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");$("resultTitle").textContent=translations[lang].complete;$("resultText").textContent=`${translations[lang].result}: ${score}/30`;return}idx++;render()}
function start(){lang=$("language").value;subject=$("subject").value;day=dayNumber();questions=buildQuestions(subject,day);idx=0;score=0;$("resultPanel").classList.add("hidden");$("quizPanel").classList.remove("hidden");render()}
$("language").addEventListener("change",()=>start());$("subject").addEventListener("change",()=>start());$("checkBtn").addEventListener("click",check);$("nextBtn").addEventListener("click",next);$("restartBtn").addEventListener("click",start);start();
</script></body></html>
